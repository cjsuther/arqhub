<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" fill="none" role="img" aria-label="ArqHub — plataforma de arquitectura empresarial model-first / IA-first">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="1" stop-color="#15142B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.22" r="0.6">
      <stop stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="0" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- decorative model graph (right) -->
  <g opacity="0.9" stroke="url(#accent)" stroke-width="2">
    <line x1="980" y1="110" x2="1090" y2="70"/>
    <line x1="980" y1="110" x2="1090" y2="180"/>
    <line x1="980" y1="110" x2="880" y2="180"/>
    <line x1="1090" y1="180" x2="1180" y2="140"/>
    <line x1="1090" y1="180" x2="1090" y2="290"/>
    <line x1="880" y1="180" x2="960" y2="280"/>
    <line x1="1090" y1="180" x2="960" y2="280"/>
  </g>
  <g>
    <circle cx="980" cy="110" r="30" fill="url(#accent)"/>
    <circle cx="980" cy="110" r="30" fill="url(#accent)" filter="url(#soft)" opacity="0.5"/>
    <circle cx="1090" cy="70" r="16" fill="#1E2140" stroke="url(#accent)" stroke-width="2.5"/>
    <circle cx="1090" cy="180" r="20" fill="#1E2140" stroke="url(#accent)" stroke-width="2.5"/>
    <circle cx="880" cy="180" r="16" fill="#1E2140" stroke="url(#accent)" stroke-width="2.5"/>
    <circle cx="1180" cy="140" r="13" fill="#1E2140" stroke="url(#accent)" stroke-width="2.5"/>
    <circle cx="1090" cy="290" r="14" fill="#1E2140" stroke="url(#accent)" stroke-width="2.5"/>
    <circle cx="960" cy="280" r="16" fill="#1E2140" stroke="url(#accent)" stroke-width="2.5"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(96,120)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#accent)"/>
    <g stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round">
      <line x1="20" y1="22" x2="44" y2="22"/>
      <line x1="20" y1="22" x2="20" y2="44"/>
      <line x1="20" y1="44" x2="44" y2="44"/>
      <line x1="44" y1="22" x2="32" y2="33"/>
      <line x1="44" y1="44" x2="32" y2="33"/>
    </g>
    <circle cx="20" cy="22" r="5" fill="#FFFFFF"/>
    <circle cx="44" cy="22" r="5" fill="#FFFFFF"/>
    <circle cx="20" cy="44" r="5" fill="#FFFFFF"/>
    <circle cx="44" cy="44" r="5" fill="#FFFFFF"/>
    <circle cx="32" cy="33" r="6" fill="#FFFFFF"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="184" y="168" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Arq<tspan fill="#A5B4FC">Hub</tspan></text>
  <text x="188" y="212" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="24" font-weight="600" fill="#C7D2FE">Arquitectura empresarial · model-first / IA-first</text>
  <text x="188" y="250" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="17" font-weight="400" fill="#8B93B8">Un repositorio semántico único. ArchiMate · BPMN · UML proyectados como vistas.</text>

  <!-- chips -->
  <g font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="14" font-weight="600">
    <g transform="translate(188,278)">
      <rect width="112" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#6366F1" stroke-opacity="0.5"/>
      <text x="56" y="20" text-anchor="middle" fill="#C7D2FE">FastAPI</text>
    </g>
    <g transform="translate(312,278)">
      <rect width="132" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#6366F1" stroke-opacity="0.5"/>
      <text x="66" y="20" text-anchor="middle" fill="#C7D2FE">React + Canvas</text>
    </g>
    <g transform="translate(456,278)">
      <rect width="150" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#6366F1" stroke-opacity="0.5"/>
      <text x="75" y="20" text-anchor="middle" fill="#C7D2FE">MCP · IA nativa</text>
    </g>
  </g>
</svg>
