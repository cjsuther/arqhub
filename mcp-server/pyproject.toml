[project]
name = "arqhub-mcp"
version = "0.1.0"
description = "ArqHub MCP server — exposes the model to LLMs (SPEC §9)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
]

[project.scripts]
arqhub-mcp = "arqhub_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
