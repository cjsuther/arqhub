# ArqHub dev stack (SPEC §3, §13). Frontend and MCP server join in later phases.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: arqhub
      POSTGRES_PASSWORD: arqhub
      POSTGRES_DB: arqhub
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arqhub"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    environment:
      ARQHUB_DATABASE_URL: postgresql+psycopg://arqhub:arqhub@db:5432/arqhub
      ARQHUB_REDIS_URL: redis://redis:6379
      ARQHUB_DEV_AUTH: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: arq app.workers.main.WorkerSettings
    environment:
      ARQHUB_DATABASE_URL: postgresql+psycopg://arqhub:arqhub@db:5432/arqhub
      ARQHUB_REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db_data:
