server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (defense-in-depth) --------------------------------
    # script-src 'self' (no 'unsafe-inline') blocks injected inline handlers such
    # as the onerror payload behind the stored-XSS class of bug — complementing the
    # server-side sanitiser. blob: is required for the ELK.js web worker; the font
    # allowances are for the Google Fonts import. If the SPA ever fails to load,
    # loosen script-src here (nonce or 'unsafe-inline') rather than removing the CSP.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # API to the backend service.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
